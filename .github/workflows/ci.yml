# Main-branch CI safety gate.
# MUST NOT call live agents or require LLM/provider API keys.
# MUST NOT upload coverage or other artifacts (pass/fail status + logs only).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with test extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest
